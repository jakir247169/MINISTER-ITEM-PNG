name: Sync Images from ShahGCreator/icon

on:
  schedule:
    - cron: '0 */6 * * *'   # প্রতি ৬ ঘণ্টা পর পর চালাবে
  workflow_dispatch:        # ম্যানুয়ালি চালানোর জন্য

jobs:
  sync-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          pip install requests

      - name: 🔄 Download images
        run: python download_images.py

      - name: 📤 Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PNG/
          git diff --staged --quiet || git commit -m "🔄 Auto-sync images from ShahGCreator/icon (${GITHUB_SHA::7})"
          git push
